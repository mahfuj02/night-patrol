version: 2
updates:
  # One weekly PR for all minor and patch updates. Majors stay separate, so each gets its own look.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node major in .nvmrc (24). Bump it by hand when that changes.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
