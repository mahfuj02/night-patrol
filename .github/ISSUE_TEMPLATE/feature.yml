name: Feature / phase task
description: A task from the phased plan or a new idea
body:
  - type: input
    id: phase
    attributes:
      label: Phase
      placeholder: 'P1: Content layer + simple view'
  - type: textarea
    id: summary
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
